<style id="sticky-header-initial-hide">
    /*
      1. Immediately hide the header in static CSS BEFORE HTML renders.
      This prevents the initial flash on page load.
    */
    header, [data-hook="site-header"] {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 999999 !important;
        opacity: 0 !important;
        transform: translateY(-100%) !important;
        pointer-events: none !important;
        transition: transform 0.3s ease, opacity 0.3s ease !important;
    }

    /*
      2. Active class applied when scrolling past threshold
    */
    header.header-visible, [data-hook="site-header"].header-visible {
        opacity: 1 !important;
        transform: translateY(0) !important;
        pointer-events: auto !important;
    }
</style>

<script>
    (function () {
        function checkScroll() {
            const header = document.querySelector('header, [data-hook="site-header"]');
            if (!header) return;

            // Measure window scroll distance across Wix engines
            const scrollY = window.scrollY ||
                window.pageYOffset ||
                document.documentElement.scrollTop ||
                document.body.scrollTop || 0;

            // Trigger point: show header after scrolling down 150px
            if (scrollY > 400) {
                header.classList.add('header-visible');
            } else {
                header.classList.remove('header-visible');
            }
        }

        // Monitor scroll events on document load
        window.addEventListener('scroll', checkScroll, { passive: true, capture: true });
        document.addEventListener('scroll', checkScroll, { passive: true, capture: true });

        // Run instantly when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkScroll);
        } else {
            checkScroll();
        }
    })();
</script>
