<script>
    window.addEventListener("load", () => {

        console.log("In addEventListener 'load' - Ident 2965a");

        const button = document.getElementById("img-comp-mve76ylx");

        if (button) {

            button.style.cursor = "pointer";

            button.addEventListener("click", function () {

                console.log("Down arrow clicked Ident 2965b");

                // Hide the down arrow
                button.style.display = "none";

                // Scroll to the top of the target section
                smoothScrollToElement("comp-muin56ou", 2000);

            });
        }
    });

    function smoothScrollToElement(elementId, duration = 2000) {

        const target = document.getElementById(elementId);

        if (!target) {
            console.warn("Scroll target not found:", elementId);
            return;
        }

        const startY = window.scrollY;

        // Calculate absolute page position of target section
        const targetY =
            target.getBoundingClientRect().top + window.scrollY;

        const distance = targetY - startY;
        const startTime = performance.now();

        // Cubic ease-in-out
        function easeInOutCubic(t) {
            return t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animateScroll(currentTime) {

            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easedProgress = easeInOutCubic(progress);

            window.scrollTo({
                top: startY + distance * easedProgress,
                behavior: "instant"
            });

            if (progress < 1) {
                requestAnimationFrame(animateScroll);
            }
        }

        requestAnimationFrame(animateScroll);
    }
</script>
