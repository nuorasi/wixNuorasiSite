    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            position: relative;
        }


        /* =========================================================
           PARTICLE LAYER
           ========================================================= */

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            display: block;

            z-index: 0;
            pointer-events: none;
        }

        /* =========================================================
           LOGO LAYER
           ========================================================= */

        #logoSVG {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            z-index: 2;

            pointer-events: none;
        }


        /* =========================================================
           INITIAL HERO STATE
           ========================================================= */

        .hero-arc-reveal {
            transform-box: fill-box;
            transform-origin: 0% 50%;
            transform: scaleX(0);
        }


        /* Wordmark starts hidden */

        #hero-wordmark {
            opacity: 0;
            transform: translateY(14px);
        }


        /* Tagline starts hidden */

        #hero-tagline {
            opacity: 0;
            transform: translateY(10px);
        }


        /* =========================================================
           START ANIMATION
           ========================================================= */

        body.hero-animate #hero-gold-reveal {
            animation:
                    hero-reveal-arc
                    0.8s
                    cubic-bezier(.22, 1, .36, 1)
                    0.05s
                    forwards;
        }


        body.hero-animate #hero-blue-reveal {
            animation:
                    hero-reveal-arc
                    0.9s
                    cubic-bezier(.22, 1, .36, 1)
                    0.22s
                    forwards;
        }


        body.hero-animate #hero-wordmark {
            animation:
                    hero-fade-up
                    0.65s
                    cubic-bezier(.22, 1, .36, 1)
                    0.45s
                    forwards;
        }


        body.hero-animate #hero-tagline {
            animation:
                    hero-fade-up
                    0.65s
                    cubic-bezier(.22, 1, .36, 1)
                    0.70s
                    forwards;
        }


        /* =========================================================
           ARC ANIMATION
           ========================================================= */

        @keyframes hero-reveal-arc {

            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }

        }


        /* =========================================================
           TEXT ANIMATION
           ========================================================= */

        @keyframes hero-fade-up {

            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .hero-arc-reveal {
                transform: scaleX(1) !important;
            }

            #hero-wordmark,
            #hero-tagline {
                opacity: 1 !important;
                transform: none !important;
            }

        }

    </style>

        //REPOSITION LOGO
        function centerLogoOnWordmark() {
            console.log(">>>>>>>>>>>> ident 2847 function centerLogoOnWordmark " );
            const svg = document.getElementById("logoSVG");
            const artwork = document.getElementById("logoArtwork");
            const wordmark = document.getElementById("hero-wordmark");

            if (!svg || !artwork || !wordmark) {
                console.log("Logo centering elements not found");
                return;
            }

            artwork.removeAttribute("transform");

            const bbox = wordmark.getBBox();

            const viewBox = svg.viewBox.baseVal;

            const svgCenterY =
                viewBox.y +
                (viewBox.height / 2);

            const wordmarkCenterY =
                bbox.y +
                (bbox.height / 2);

            const offsetY =
                svgCenterY -
                wordmarkCenterY;

            artwork.setAttribute(
                "transform",
                `translate(0 ${offsetY})`
            );

            console.log(
                "Wordmark dynamically centered:",
                {
                    svgCenterY,
                    wordmarkCenterY,
                    offsetY
                }
            );
        }


        function resizeParticleCanvas() {
            console.log("resizeParticleCanvas CALLED");

            const canvas = document.getElementById('particleCanvas');

            if (!canvas) return;

            const width = window.innerWidth;
            const height = window.innerHeight;

            canvas.style.position = "absolute";
            canvas.style.top = "0px";
            canvas.style.left = "0px";
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            //canvas.style.height = "500px";

            if (typeof renderer !== "undefined") {

                renderer.setSize(
                    width,
                    height,
                    false
                );
            }

            if (typeof camera !== "undefined") {

                camera.aspect = width / height;
                camera.updateProjectionMatrix();

            }
            console.log(">>>>>>>>>>>> DEBUG Ident 1 ");
            centerLogoOnWordmark();
        }

            console.log(" >>>>>>>>>>>>>>>>>>>>  in function positionHeroIndicator() indicator = comp-muin56ou ")

        window.addEventListener('load', positionHeroIndicator);

        (function () {

            let heroAnimationStarted = false;


            function startHeroAnimation() {

                if (heroAnimationStarted) {
                    return;
                }

                heroAnimationStarted = true;

                console.log(
                    "Nuorasi Hero: starting logo animation"
                );

                document.body.classList.add(
                    "hero-animate"
                );

            }


            /*
             * Receive animation command from Wix parent page.
             */

            window.addEventListener(
                "message",
                function (event) {

                    if (
                        event.data &&
                        event.data.type ===
                        "nuorasi-start-hero-animation"
                    ) {

                        startHeroAnimation();

                    }

                }
            );


            /*
             * Safety fallback.
             */

            setTimeout(
                startHeroAnimation,
                50
            );


        })();
