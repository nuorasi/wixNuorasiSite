           PARTICLE LAYER
           ========================================================= */

        #particleCanvas {

           ========================================================= */

            position: absolute;
            inset: 0;

            height: 100%;

           HERO MESSAGE LAYER
           ========================================================= */

        #hero1 {

            width: 100%;
            height: 100%;
        }
        #hero-message {
            font-weight: 700;
        }

        #logoSVG {
            transition:
                    opacity 1.4s cubic-bezier(.22, 1, .36, 1),
                    transform 1.4s cubic-bezier(.22, 1, .36, 1);
        }

        #hero-message {
            position: absolute;
            top: 50%;
            left: 50%;

            width: min(1180px, 88vw);

            transform: translate(-50%, calc(-50% + 18px));

            z-index: 3;
            pointer-events: none;

            text-align: center;
            white-space: normal;

            font-family: Inter Avenir Next, Montserrat, Helvetica Neue, Arial, sans-serif;
            font-size: clamp(30px, 4.2vw, 64px);
            font-weight: 400;
            line-height: 1.18;
            letter-spacing: 0.01em;

            color: #1D1D1F;

            opacity: 0;

            transition:
                    opacity 1.4s cubic-bezier(.22, 1, .36, 1) 0.15s,
                    transform 1.4s cubic-bezier(.22, 1, .36, 1) 0.15s;
        }

        /* Quick anticipation shrink before the logo expands away. */
        body.hero-logo-shrink #logoSVG {
            transform: scale(0.70);
            transition:
                    transform 0.15s cubic-bezier(.4, 0, .2, 1);
        }

        body.hero-message-active #logoSVG {
            opacity: 0;
            transform: translateY(100px) scale(5.0);
        }

        body.hero-message-active #hero-message {
            opacity: 1;
            transform: translate(-50%, -50%);
        }


        /* =========================================================
           INITIAL HERO STATE
           ========================================================= */

        .hero-arc-reveal {
            transform-box: fill-box;
            transform-origin: 0% 50%;
            transform: scaleX(0);
        }


        /* Wordmark starts hidden */

        #hero-wordmark {
            opacity: 0;
            transform: translateY(14px);
        }


        /* Tagline starts hidden */

        #hero-tagline {
            opacity: 0;
            transform: translateY(10px);
        }


        /* =========================================================
           START ANIMATION
           ========================================================= */

        body.hero-animate #hero-gold-reveal {
            animation:
                    hero-reveal-arc
                    0.8s
                    cubic-bezier(.22, 1, .36, 1)
                    0.05s
                    forwards;
        }


        body.hero-animate #hero-blue-reveal {
            animation:
                    hero-reveal-arc
                    0.9s
                    cubic-bezier(.22, 1, .36, 1)
                    0.22s
                    forwards;
        }


        body.hero-animate #hero-wordmark {
            animation:
                    hero-fade-up
                    0.65s
                    cubic-bezier(.22, 1, .36, 1)
                    0.45s
                    forwards;
        }


        body.hero-animate #hero-tagline {
            animation:
                    hero-fade-up
                    0.65s
                    cubic-bezier(.22, 1, .36, 1)
                    0.70s
                    forwards;
        }


        /* =========================================================
           ARC ANIMATION
           ========================================================= */

        @keyframes hero-reveal-arc {

            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }

        }


        /* =========================================================
           TEXT ANIMATION
           ========================================================= */

        @keyframes hero-fade-up {

            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .hero-arc-reveal {
                transform: scaleX(1) !important;
            }

            #hero-wordmark,
            #hero-tagline {
                opacity: 1 !important;
                transform: none !important;
            }


            #logoSVG,
            #hero-message {
                transition: none !important;
            }

        }

        function centerLogoOnWordmark() {
            console.log(">>>>>>>>>>>> ident 2342a function centerLogoOnWordmark " );
            const svg = document.getElementById("logoSVG");
            const artwork = document.getElementById("logoArtwork");
            const wordmark = document.getElementById("hero-wordmark");

            if (!svg || !artwork || !wordmark) {
                console.log("Logo  2342b centering elements not found");
                return;
            }

            artwork.removeAttribute("transform");

            const bbox = wordmark.getBBox();

            const viewBox = svg.viewBox.baseVal;

            const svgCenterY =
                viewBox.y +
                (viewBox.height / 2);

            const wordmarkCenterY =
                bbox.y +
                (bbox.height / 2);

            const offsetY =
                svgCenterY -
                wordmarkCenterY;

            artwork.setAttribute(
                "transform",
                `translate(0 ${offsetY})`
            );

            console.log(
                "Wordmark 2342c dynamically centered:",
                {
                    svgCenterY,
                    wordmarkCenterY,
                    offsetY
                }
            );
        }

            //canvas.style.height = "500px";

            if (typeof renderer !== "undefined") {

                renderer.setSize(
                    width,
                    height,

                );
            }

            if (typeof camera !== "undefined") {

                camera.aspect = width / height;
                camera.updateProjectionMatrix();

            }
            console.log(">>>>>>>>>>>> DEBUG 2342e Ident 1 ");
            centerLogoOnWordmark();
        }

    <script>
        function refreshParticleSystem() {

            console.log(">>>>>>>> refreshParticleSystem()");

            const canvas = document.getElementById("particleCanvas");

            if (!canvas) {
                console.log("particleCanvas not found");
                return;
            }

            console.log(
                "Canvas:",
                canvas.getBoundingClientRect()
            );

            resizeParticleCanvas();

            /*
             * Force THREE renderer/camera to use the
             * current Wix iframe dimensions.
             */
            if (
                typeof renderer !== "undefined" &&
                typeof camera !== "undefined"
            ) {

                const width = window.innerWidth;
                const height = window.innerHeight;

                renderer.setSize(
                    width,
                    height,
                    false
                );

                camera.aspect =
                    width / height;

                camera.updateProjectionMatrix();

                console.log(
                    "Particle renderer refreshed:",
                    width,
                    height
                );
            }
        }

    </script>

        function positionHeroIndicator(inHeight) {

            console.log(" >>>>>>>>>>>>>>>>>>>>  in function 2342h positionHeroIndicator() indicator = comp-muin56ou ")
            const indicator = document.getElementById('comp-muin56ou');
            console.log(">>>>>  const indicator ="+ document.getElementById('comp-muin56ou') )

            if (!indicator || !hero) {

                return;

            const heroRect = hero.getBoundingClientRect();

            // Absolute page position of hero1
            const heroTop = heroRect.top + window.scrollY;

            // Position indicator just above hero1
            indicator.style.position = 'absolute';

            indicator.style.top = inHeight + 'px';

            // Position near right side of page
            indicator.style.right = '30px';
            indicator.style.left = 'auto';

            console.log("Indicator 2342j positioned at:", indicator.style.top);
        }


        window.addEventListener('load', positionHeroIndicator);
        window.addEventListener('resize', positionHeroIndicator);

        (function () {

            let heroAnimationStarted = false;


            function startHeroAnimation() {

                if (heroAnimationStarted) {
                    return;
                }

                heroAnimationStarted = true;

                console.log(
                    "Nuorasi Hero: 2342k  starting logo animation"
                );

                document.body.classList.add(
                    "hero-animate"
                );

                /*
                 * Keep the completed logo on screen briefly, then
                 * crossfade it into the primary hero message.
                 * Three.js is untouched, so the particle animation
                 * continues to render behind both states.
                 */
                setTimeout(() => {

                    /*
                     * Anticipation beat: quickly shrink the completed logo
                     * to 90%, then launch the existing expand/fade transition.
                     */
                    document.body.classList.add(
                        "hero-logo-shrink"
                    );

                    setTimeout(() => {

                        document.body.classList.remove(
                            "hero-logo-shrink"
                        );

                        /*
                         * Use the next animation frame so the browser commits
                         * the 90% state before transitioning to scale(3.0).
                         */
                        requestAnimationFrame(() => {
                            document.body.classList.add(
                                "hero-message-active"
                            );
                        });

                    }, 150);

                }, 4500);

            }


            /*
             * Receive animation command from Wix parent page.
             */

            window.addEventListener(
                "message",
                function (event) {

                    if (
                        event.data &&
                        event.data.type ===
                        "nuorasi-start-hero-animation"
                    ) {

                        startHeroAnimation();

                    }

                }
            );


            /*
             * Safety fallback.
             */

            setTimeout(
                startHeroAnimation,
                50
            );


        })();
