    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            position: relative;
        }


        /* =========================================================
           PARTICLE LAYER
           ========================================================= */

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            display: block;

            z-index: 0;
            pointer-events: none;
        }

        /* =========================================================
           LOGO LAYER
           ========================================================= */


        #logoSVG {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            z-index: 2;

            pointer-events: none;
        }

        /*
         #logoSVG {
            position: absolute;

            width: 1000px;
            max-width: 90vw;
            height: auto;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            display: block;

            z-index: 2;
            pointer-events: none;

         */


        /* =========================================================
           HERO MESSAGE LAYER
           ========================================================= */

        #hero1 {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #hero-message {
            font-weight: 700;
        }

        #logoSVG {
            transition:
                    opacity 1.4s cubic-bezier(.22, 1, .36, 1),
                    transform 1.4s cubic-bezier(.22, 1, .36, 1);
        }

        #hero-message {
            position: absolute;
            top: 50%;
            left: 50%;

            width: min(1180px, 88vw);

            transform: translate(-50%, calc(-50% + 18px));

            z-index: 3;
            pointer-events: none;

            text-align: center;
            white-space: normal;

            font-family: Inter, "Avenir Next", Montserrat, "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(30px, 4.2vw, 64px);
            font-weight: 700;
            line-height: 1.18;
            letter-spacing: 0.01em;

            color: #1D1D1F;

            opacity: 0;

            transition:
                    opacity 1.4s cubic-bezier(.22, 1, .36, 1) 0.15s,
                    transform 1.4s cubic-bezier(.22, 1, .36, 1) 0.15s;
        }

        /* Quick anticipation shrink before the logo expands away. */
        body.hero-logo-shrink #logoSVG {
            transform: scale(0.70);
            transition:
                    transform 0.15s cubic-bezier(.4, 0, .2, 1);
        }

        body.hero-message-active #logoSVG {
            opacity: 0;
            transform: translateY(100px) scale(5.0);
        }

        body.hero-message-active #hero-message {
            opacity: 1;
            transform: translate(-50%, -50%);
        }


        /* =========================================================
           INITIAL HERO STATE
           ========================================================= */

        .hero-arc-reveal {
            transform-box: fill-box;
            transform-origin: 0% 50%;
            transform: scaleX(0);
        }


        /* Wordmark starts hidden */

        #hero-wordmark {
            opacity: 0;
            transform: translateY(14px);
        }


        /* Tagline starts hidden */

        #hero-tagline {
            opacity: 0;
            transform: translateY(10px);
        }


        /* =========================================================
           START ANIMATION
           ========================================================= */

        body.hero-animate #hero-gold-reveal {
            animation:
                    hero-reveal-arc
                    0.8s
                    cubic-bezier(.22, 1, .36, 1)
                    0.05s
                    forwards;
        }


        body.hero-animate #hero-blue-reveal {
            animation:
                    hero-reveal-arc
                    0.9s
                    cubic-bezier(.22, 1, .36, 1)
                    0.22s
                    forwards;
        }


        body.hero-animate #hero-wordmark {
            animation:
                    hero-fade-up
                    0.65s
                    cubic-bezier(.22, 1, .36, 1)
                    0.45s
                    forwards;
        }


        body.hero-animate #hero-tagline {
            animation:
                    hero-fade-up
                    0.65s
                    cubic-bezier(.22, 1, .36, 1)
                    0.70s
                    forwards;
        }


        /* =========================================================
           ARC ANIMATION
           ========================================================= */

        @keyframes hero-reveal-arc {

            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }

        }


        /* =========================================================
           TEXT ANIMATION
           ========================================================= */

        @keyframes hero-fade-up {

            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================================
           REDUCED MOTION
           ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .hero-arc-reveal {
                transform: scaleX(1) !important;
            }

            #hero-wordmark,
            #hero-tagline {
                opacity: 1 !important;
                transform: none !important;
            }


            #logoSVG,
            #hero-message {
                transition: none !important;
            }

        }

    </style>

    <script>
        // The HTML embed owns visual layout and logo centering, not WebGL.
        function centerLogoOnWordmark() {
            const svg = document.getElementById('logoSVG');
            const artwork = document.getElementById('logoArtwork');
            const wordmark = document.getElementById('hero-wordmark');
            if (!svg || !artwork || !wordmark) return;
            artwork.removeAttribute('transform');
            const bbox = wordmark.getBBox();
            const viewBox = svg.viewBox.baseVal;
            const offsetY = (viewBox.y + viewBox.height / 2) - (bbox.y + bbox.height / 2);
            artwork.setAttribute('transform', `translate(0 ${offsetY})`);
        }

        function resizeParticleCanvas() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            // CSS controls the display size. newParticle.js owns backing pixels.
            canvas.style.width = Math.max(1, window.innerWidth) + 'px';
            canvas.style.height = Math.max(1, window.innerHeight) + 'px';
            if (typeof window.nuorasiResizeParticles === 'function') {
                window.nuorasiResizeParticles();
            }
            centerLogoOnWordmark();
        }

        function refreshParticleSystem() {
            resizeParticleCanvas();
        }

        window.addEventListener('resize', resizeParticleCanvas);
        window.addEventListener('orientationchange', resizeParticleCanvas);
        const hero1 = document.getElementById('hero1');
        if (hero1 && typeof ResizeObserver !== 'undefined') {
            new ResizeObserver(() => resizeParticleCanvas()).observe(hero1);
        }
    </script>

    <!-- Particle animation (deploy the companion newParticle.js to this URL) -->
    <script src="https://cdn.jsdelivr.net/gh/nuorasi/wixNuorasiSite@main/newParticle.js"></script>

    <!-- =======================================================
         HERO ANIMATION CONTROL
         ======================================================= -->

    <script>


        // Wix arrow elements live in the parent page and cannot be positioned
        // using document.getElementById() inside this HTML embed iframe.

        (function () {

            let heroAnimationStarted = false;


            function startHeroAnimation() {

                if (heroAnimationStarted) {
                    return;
                }

                heroAnimationStarted = true;

                console.log(
                    "Nuorasi Hero: 2342k  starting logo animation"
                );

                document.body.classList.add(
                    "hero-animate"
                );

                /*
                 * Keep the completed logo on screen briefly, then
                 * crossfade it into the primary hero message.
                 * Three.js is untouched, so the particle animation
                 * continues to render behind both states.
                 */
                setTimeout(() => {

                    /*
                     * Anticipation beat: quickly shrink the completed logo
                     * to 90%, then launch the existing expand/fade transition.
                     */
                    document.body.classList.add(
                        "hero-logo-shrink"
                    );

                    setTimeout(() => {

                        document.body.classList.remove(
                            "hero-logo-shrink"
                        );

                        /*
                         * Use the next animation frame so the browser commits
                         * the 90% state before transitioning to scale(3.0).
                         */
                        requestAnimationFrame(() => {
                            document.body.classList.add(
                                "hero-message-active"
                            );
                            // Parent-page arrows must be controlled by Wix custom code.
                        });

                    }, 150);

                }, 4500);

            }


            /*
             * Receive animation command from Wix parent page.
             */

            window.addEventListener(
                "message",
                function (event) {

                    if (
                        event.data &&
                        event.data.type ===
                        "nuorasi-start-hero-animation"
                    ) {

                        startHeroAnimation();

                    }

                }
            );


            /*
             * Safety fallback.
             */

            setTimeout(
                startHeroAnimation,
                50
            );


        })();

        function jogHomePage() {
            console.log("In function 2342l jogHomePage")

            window.scrollBy({
                top: 300,
                behavior: "smooth"
            });
        }





        window.addEventListener('load', () => {
            document.fonts.ready.then(centerLogoOnWordmark);
            refreshParticleSystem();
        });
        window.addEventListener('pageshow', refreshParticleSystem);
        // Diagnostic for failures without breaking the logo hero animation.
        window.addEventListener('nuorasi-particles-error', (event) => {
            console.warn('Nuorasi particle animation unavailable:', event.detail.reason);
        });

    </script>
